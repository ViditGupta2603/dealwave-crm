<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dealwave CRM</title>
    <script>
      // Dark (AMOLED black) is the default look. Only someone who switched to light themselves gets light.
      try {
        var t = localStorage.getItem('dealwave.theme');
        if (t !== 'light') document.documentElement.setAttribute('data-theme', 'dark');
        else document.querySelector('meta[name=theme-color]').setAttribute('content', '#0E2A26');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
